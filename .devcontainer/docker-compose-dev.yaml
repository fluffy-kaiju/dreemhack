version: '3.8'
services:
  devcontainer:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-20-bullseye
    networks:
      - dev
    volumes:
      - ..:/node:cached
    # network_mode: service:db
    command: >
      bash -c "
        curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | bash &&
        apt-get update && apt-get install -y infisical nmap python3 python3-pip &&
        cd /node/server/libs/OneForAll && python3 -m pip install -U pip setuptools wheel && pip3 install -r requirements.txt &&
        cd /node/server && npm i &&
        cd /node/app && npm i &&
        cd /node/ && infisical vault set file &&
        sleep infinity"

  # db:
  #   container_name: redis
  #   image: redis/redis-stack-server:latest
  #   restart: unless-stopped
  #   volumes:
  #     - redis-data:/data
  #   ports:
  #     - "6379:6379"

  db:
    container_name: postgres
    image: postgres:16.0
    restart: always
    environment:
      - POSTGRES_PASSWORD=test
      - POSTGRES_USER=test
      - POSTGRES_DB=test
    networks:
      - dev
    # ports:
    # - "5432:5432"
    # volumes:
    # //TODO check if this is the right path
    # - db_data:/var/lib/postgresql
volumes:
  postgres-data:
  # redis-data:

networks:
  dev:
